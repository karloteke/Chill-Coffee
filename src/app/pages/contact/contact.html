<section class="contact-section">
  <h2>Contáctanos</h2>
  <p class="intro">¿Tienes alguna pregunta, sugerencia o quieres saber más sobre nuestros cafés?</p>

  <form (ngSubmit)="onSubmit()" *ngIf="!submitted; else successMsg">
    <div class="form-group">
      <label for="name">Nombre</label>
      <input id="name" name="name" [(ngModel)]="contact.name" required />
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" [(ngModel)]="contact.email" required />
    </div>

    <div class="form-group">
      <label for="message">Mensaje</label>
      <textarea id="message" name="message" rows="5" [(ngModel)]="contact.message" required></textarea>
    </div>

    <button type="submit" class="submit-btn">Enviar mensaje</button>
  </form>

  <ng-template #successMsg>
    <div class="success">
      <h3>¡Gracias por contactarnos! ☕</h3>
      <p>Te responderemos lo antes posible.</p>
      <button (click)="submitted = false">Enviar otro mensaje</button>
    </div>
  </ng-template>
</section>
